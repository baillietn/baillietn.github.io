# Content of the CV. Every version of the CV is generated from this file by ./generate-cv.sh
#
# Text fields accept **bold**; no HTML, no LaTeX. Dates are "YYYY-MM" or "present".
#
# Versions, one page each: `design-a4` (the CV page and its A4 PDF), `classic-a4` and
# `classic-letter` (the sober one-column CV, in A4 and US Letter).
# `hide_in: [classic]` on an item leaves it out of both Classic versions; a version name
# (`design-a4`, `classic-a4`, `classic-letter`) targets one version only. It works on an
# entry, a bullet, a skill, a link, a section or an availability detail. A bullet that
# needs it is written as:
#       - text: "..."
#         hide_in: [classic]
#
# `sections` is the main column, in order. To add a section, add an item to the list:
#
#   - title: Publications          # heading
#     classic_title: Publications  # optional: another heading in the Classic versions
#     entries:                     # a list of entries ...
#       - title: "..."             #   (all fields but `title` are optional)
#         organization: "..."
#         location: "..."            # city
#         country: "..."             # shown after the city in the Classic versions
#         start: "2026-01"
#         end: present               # or "YYYY-MM"; add `expected: true` for a future end
#         tech: [Python, PyTorch]
#         description: "..."
#         bullets:
#           - "..."
#
#   - title: About me
#     text: "..."                  # ... or a paragraph instead of entries
#     classic_text: "..."          # optional: another paragraph in the Classic versions
#
# An education entry gives `degree` and `school` instead of `title`: the designed CV shows
# "degree — school", the Classic versions put the school first and the degree below.
# On a project, `bullets` are used by the Classic versions and `description` by the
# designed CV.
#
# `style: projects` on a section renders its entries as project cards (name, links,
# metrics, tech, description) instead of dated entries.

